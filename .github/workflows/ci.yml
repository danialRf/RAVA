name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rava
          POSTGRES_USER: rava
          POSTGRES_PASSWORD: rava
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rava -d rava"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rava:rava@localhost:5432/rava
      # The integration tests drop and recreate this database on every run.
      TEST_DATABASE_URL: postgresql://rava:rava@localhost:5432/rava_test
      # CI has no MinIO service; uploads exercise the deterministic private
      # storage adapter while provider integration stays covered separately.
      STORAGE_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:generate
      - run: git diff --exit-code packages/db/migrations
      - run: pnpm test
      - run: pnpm worker:smoke
      - run: pnpm db:seed
      # `test:e2e` owns the single production build through `pretest:e2e`.
      - run: pnpm test:e2e
