name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rava
          POSTGRES_USER: rava
          POSTGRES_PASSWORD: rava
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rava -d rava"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rava:rava@localhost:5432/rava
      # The integration tests drop and recreate this database on every run.
      TEST_DATABASE_URL: postgresql://rava:rava@localhost:5432/rava_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:generate
      - run: git diff --exit-code packages/db/migrations
      - run: pnpm test
      - run: pnpm worker:smoke
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test:e2e
