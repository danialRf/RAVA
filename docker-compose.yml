name: rava-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rava
      POSTGRES_USER: rava
      POSTGRES_PASSWORD: rava
    ports:
      # Windows/Hyper-V sometimes reserves the 5408-5507 range, which makes
      # publishing 5432 fail. Override POSTGRES_HOST_PORT in .env when that
      # happens and point DATABASE_URL at the same port.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - rava-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rava -d rava"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rava-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rava-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/rava-public &&
      mc mb --ignore-existing local/rava-private &&
      mc anonymous set download local/rava-public"
    restart: "no"

volumes:
  rava-postgres:
  rava-redis:
  rava-minio:
